<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f5fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111519" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="健康日报">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<title>健康日报</title>
<style>
  :root{
    --bg:#f2f5fa; --bg2:#e9eef7; --card:#ffffff; --ink:#131a24; --muted:#7b879a;
    --line:#eaeff6; --chip:#f2f5fa;
    --sleep:#6c7cf0; --sleep2:#9aa6ff;
    --steps:#f2994a; --steps2:#ffc38a;
    --hr:#ec5b5b; --ok:#2fb388; --warn:#e0a03a;
    --shadow:0 1px 2px rgba(20,35,70,.05), 0 10px 30px -18px rgba(20,35,70,.35);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1318; --bg2:#0b0f14; --card:#171d24; --ink:#e9eef6; --muted:#8b98a9;
      --line:#232b35; --chip:#1e252e;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -20px rgba(0,0,0,.8);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:linear-gradient(170deg,var(--bg) 0%,var(--bg2) 100%);
    min-height:100vh;color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Roboto,sans-serif;
    padding:max(16px,env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:480px;margin:0 auto}
  /* ---------- header ---------- */
  header{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 2px 16px}
  h1{font-size:22px;margin:0;letter-spacing:-.4px;font-weight:650}
  .sub{font-size:12.5px;color:var(--muted);margin-top:4px}
  .live{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(47,179,136,.15)}
  .dot.stale{background:var(--warn);box-shadow:0 0 0 3px rgba(224,160,58,.15)}
  /* ---------- cards ---------- */
  .card{background:var(--card);border-radius:20px;padding:16px 16px 15px;box-shadow:var(--shadow);margin-bottom:12px}
  .card h2{font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 10px;letter-spacing:.5px;
    display:flex;justify-content:space-between;align-items:center;gap:8px}
  .big{font-size:34px;font-weight:660;letter-spacing:-1.2px;line-height:1.08;font-variant-numeric:tabular-nums}
  .big small{font-size:13.5px;font-weight:500;color:var(--muted);margin-left:3px;letter-spacing:0}
  .hint{font-size:12px;color:var(--muted);margin-top:7px}
  .tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--chip);color:var(--muted);font-weight:500;white-space:nowrap}
  .bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:12px}
  .bar>i{display:block;height:100%;border-radius:8px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .grid2 .card{margin:0}
  /* ---------- hero ---------- */
  .hero{padding:18px 18px 16px}
  .hero .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .ring{position:relative;width:76px;height:76px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:650;letter-spacing:-.4px}
  /* ---------- trend ---------- */
  .trend{margin-top:4px}
  .bars{display:flex;align-items:flex-end;gap:6px;height:96px;padding-top:18px}
  .bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;
    cursor:pointer;position:relative;height:100%}
  .bcol .v{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;opacity:.9;white-space:nowrap}
  .bcol .b{width:100%;border-radius:7px 7px 4px 4px;background:linear-gradient(180deg,var(--steps2),var(--steps));
    min-height:3px;transition:filter .15s, transform .15s}
  .bcol.sleep .b{background:linear-gradient(180deg,var(--sleep2),var(--sleep))}
  .bcol:active .b{filter:brightness(.94);transform:scaleY(.98)}
  .bcol.empty .b{background:var(--line)}
  .axis{display:flex;justify-content:space-between;margin-top:6px;font-size:10.5px;color:var(--muted)}
  .axis span{flex:1;text-align:center}
  .avgrow{display:flex;gap:10px;margin-top:12px}
  .avg{flex:1;background:var(--chip);border-radius:12px;padding:9px 11px}
  .avg em{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-bottom:2px}
  .avg b{font-size:16px;font-weight:640;font-variant-numeric:tabular-nums}
  /* ---------- calendar ---------- */
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .calhead .m{font-size:14.5px;font-weight:640;letter-spacing:-.2px}
  .nav{display:flex;gap:6px}
  .nav button{width:30px;height:30px;border-radius:10px;border:1px solid var(--line);background:var(--card);
    color:var(--ink);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .nav button:active{background:var(--chip)}
  .wd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
  .wd span{text-align:center;font-size:10.5px;color:var(--muted)}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cell{position:relative;aspect-ratio:1/1;border-radius:11px;background:var(--chip);border:none;padding:0;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;cursor:pointer;
    color:var(--ink);font:inherit;overflow:hidden;transition:transform .12s}
  .cell:active{transform:scale(.95)}
  .cell.dim{opacity:.32}
  .cell.future{opacity:.42}
  .cell.today{box-shadow:inset 0 0 0 2px var(--steps)}
  .cell.sel{box-shadow:inset 0 0 0 2px var(--sleep)}
  .cell .d{font-size:11.5px;line-height:1;margin-top:7px;font-variant-numeric:tabular-nums}
  .cell .s{font-size:9.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
  .cell .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(242,153,74,.25),rgba(242,153,74,.55))}
  .cell .moon{position:absolute;top:5px;right:5px;width:4px;height:4px;border-radius:50%;background:var(--sleep)}
  /* ---------- month summary ---------- */
  .mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .mstat{background:var(--chip);border-radius:12px;padding:9px 10px;text-align:center}
  .mstat em{display:block;font-style:normal;font-size:10.5px;color:var(--muted)}
  .mstat b{font-size:15px;font-weight:640;font-variant-numeric:tabular-nums}
  /* ---------- sheet ---------- */
  .mask{position:fixed;inset:0;background:rgba(10,16,26,.45);opacity:0;pointer-events:none;
    transition:opacity .22s;z-index:40;backdrop-filter:blur(2px)}
  .mask.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
    border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));
    transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 -8px 40px rgba(10,20,40,.18);max-height:82vh;overflow:auto}
  .sheet.on{transform:translateY(0)}
  .sheet .grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 12px}
  .sheet h3{margin:0 0 2px;font-size:17px;letter-spacing:-.3px}
  .sheet .when{font-size:12px;color:var(--muted);margin-bottom:14px}
  .drow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
  .drow:last-child{border-bottom:none}
  .drow .k{color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:8px}
  .drow .v{font-size:16px;font-weight:640;font-variant-numeric:tabular-nums}
  .drow .v small{font-size:11.5px;color:var(--muted);font-weight:500;margin-left:6px}
  .sec{margin-top:6px}
  .sec .sec-t{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.6px;
    margin:14px 0 2px;display:flex;align-items:center;gap:8px}
  .sec .sec-t::after{content:'';flex:1;height:1px;background:var(--line)}
  .kdot{width:7px;height:7px;border-radius:50%;flex:none}
  .empty-note{color:var(--muted);font-size:13px;text-align:center;padding:22px 0}
  /* ---------- states ---------- */
  .state{text-align:center;padding:40px 22px}
  .state .emo{font-size:30px}
  .state p{color:var(--muted);font-size:13.5px;margin:10px 0 0;line-height:1.7}
  code{background:var(--chip);padding:1px 6px;border-radius:6px;font-size:12px}
  footer{text-align:center;font-size:11px;color:var(--muted);opacity:.8;margin-top:18px;line-height:1.9}
  /* ---------- 安装提示 ---------- */
  .installbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
    background:var(--card);border-radius:16px;box-shadow:0 8px 30px rgba(15,25,45,.18);
    padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:30;border:1px solid var(--line)}
  .installbar p{margin:0;font-size:12.5px;color:var(--muted);flex:1;line-height:1.45}
  .installbar p b{color:var(--ink);font-weight:600}
  .installbar button{border:none;border-radius:11px;padding:8px 13px;font:inherit;font-size:13px;cursor:pointer}
  .installbar .go{background:var(--sleep);color:#fff;font-weight:600}
  .installbar .no{background:transparent;color:var(--muted);padding:8px 6px}
  .sk{height:13px;border-radius:7px;background:linear-gradient(90deg,var(--chip) 25%,var(--line) 37%,var(--chip) 63%);
    background-size:400% 100%;animation:sk 1.3s ease infinite}
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="greet">今天的状态</h1>
      <div class="sub" id="todayLabel">加载中…</div>
    </div>
    <div class="live"><span class="dot" id="dot"></span><span id="updated">同步中</span></div>
  </header>

  <div id="app">
    <div class="card"><div class="sk" style="width:40%"></div>
      <div class="sk" style="width:62%;height:30px;margin-top:12px"></div></div>
    <div class="grid2">
      <div class="card"><div class="sk" style="width:55%"></div><div class="sk" style="width:75%;height:26px;margin-top:12px"></div></div>
      <div class="card"><div class="sk" style="width:55%"></div><div class="sk" style="width:75%;height:26px;margin-top:12px"></div></div>
    </div>
  </div>

  <footer>
    数据来自 Apple Watch，经 iPhone 自动上报<br>
    点任意一天可以看当天明细
  </footer>
</div>

<div class="installbar" id="installBar" hidden>
  <p><b>装到桌面</b><br>点开就是全屏，不用记网址</p>
  <button class="go" id="installGo">安装</button>
  <button class="no" id="installNo">以后</button>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

<script>
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
const YM = ['1 月','2 月','3 月','4 月','5 月','6 月','7 月','8 月','9 月','10 月','11 月','12 月'];
const SLEEP_GOAL = 8, STEP_GOAL = 8000;

const EXTRA_META = {
  active_energy:{n:'活动能量',u:'千卡'}, basal_energy_burned:{n:'基础代谢',u:'千卡'},
  walking_running_distance:{n:'步行距离',u:'公里'}, flights_climbed:{n:'爬楼层数',u:'层'},
  walking_speed:{n:'步行速度',u:'km/h'}, walking_step_length:{n:'步长',u:'cm'},
  walking_asymmetry_percentage:{n:'步行不对称',u:'%'}, walking_double_support_percentage:{n:'双脚支撑',u:'%'},
  headphone_audio_exposure:{n:'耳机音量',u:'dB'}, heart_rate_variability:{n:'心率变异性',u:'ms'},
  apple_sleeping_wrist_temperature:{n:'腕温',u:'°C'}, vo2_max:{n:'最大摄氧量',u:''},
};

const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = new Date();
const TODAY = iso(today);

const dayMap = {};      // 'YYYY-MM-DD' -> day object
let calYear = today.getFullYear(), calMonth = today.getMonth();  // 0-based
let loadedRanges = [];  // [{start,end}]
let selectedDay = null;

function fmtSleep(h){
  if (h == null) return ['--',''];
  const hh = Math.floor(h), mm = Math.round((h-hh)*60);
  return [String(hh), `${mm} 分`];
}
const fmtN = n => n == null ? '--' : n.toLocaleString('zh-CN');
const tone = v => v >= 80 ? '偏低' : v <= 75 ? '正常' : '偏高';
const hrTone = v => v == null ? '--' : (v < 60 ? '偏低' : v <= 75 ? '正常范围' : '偏高，留意休息');

/* ---------------- 数据 ---------------- */
async function fetchRange(start, end){
  const r = await fetch(`/api/days?start=${start}&end=${end}&token=${encodeURIComponent(TOKEN)}`);
  if (r.status === 401) throw new Error('AUTH');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const data = await r.json();
  (data.days || []).forEach(d => { dayMap[d.day] = d; });
  loadedRanges.push({start, end});
  return data;
}
function covered(start, end){
  return loadedRanges.some(r => r.start <= start && r.end >= end);
}

/* ---------------- 今日 ---------------- */
function renderToday(){
  const t = dayMap[TODAY] || {};
  const d = parseISO(TODAY);
  $('#todayLabel').textContent = `${d.getMonth()+1} 月 ${d.getDate()} 日 · ${WEEK[d.getDay()]}`;
  const up = t.updated_at || '';
  $('#updated').textContent = up ? '更新 ' + up.slice(5) : '暂无数据';
  $('#dot').className = 'dot' + (up ? '' : ' stale');

  const [sh, sm] = fmtSleep(t.sleep_hours);
  const sleepPct = t.sleep_hours ? Math.min(t.sleep_hours / SLEEP_GOAL * 100, 100) : 0;
  const stepPct = t.steps ? Math.min(t.steps / STEP_GOAL * 100, 100) : 0;

  const y = dayMap[iso(new Date(d.getFullYear(), d.getMonth(), d.getDate()-1))];
  const diff = (t.sleep_hours != null && y && y.sleep_hours != null) ? t.sleep_hours - y.sleep_hours : null;
  const diffTxt = diff == null ? '昨夜睡眠' :
    (Math.abs(diff) < 0.05 ? '和前晚差不多' :
     (diff > 0 ? `比前晚多睡 ${Math.round(diff*60)} 分钟` : `比前晚少睡 ${Math.round(-diff*60)} 分钟`));

  if (!t.has_data){
    $('#app').innerHTML = `<div class="card state"><div class="emo">🌙</div>
      <p>还没有收到今天的数据。<br>等 iPhone 下次自动上报后刷新即可。</p></div>`;
    return;
  }

  const C = 2 * Math.PI * 32;
  $('#app').innerHTML = `
    <div class="card hero">
      <h2><span>昨晚睡眠</span><span class="tag">目标 ${SLEEP_GOAL} 小时</span></h2>
      <div class="row">
        <div>
          <div class="big">${sh}<small>小时</small>${sm ? `<small style="margin-left:6px">${sm}</small>` : ''}</div>
          <div class="hint">${diffTxt}</div>
        </div>
        <div class="ring">
          <svg width="76" height="76" viewBox="0 0 76 76">
            <circle cx="38" cy="38" r="32" fill="none" stroke="var(--line)" stroke-width="7"/>
            <circle cx="38" cy="38" r="32" fill="none" stroke="url(#sg)" stroke-width="7"
              stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-sleepPct/100)}"/>
            <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#9aa6ff"/><stop offset="100%" stop-color="#6c7cf0"/>
            </linearGradient></defs>
          </svg>
          <b>${Math.round(sleepPct)}%</b>
        </div>
      </div>
    </div>

    <div class="grid2">
      <div class="card" data-day="${TODAY}">
        <h2>步数</h2>
        <div class="big" style="font-size:27px">${fmtN(t.steps)}<small>步</small></div>
        <div class="bar"><i style="width:${stepPct}%;background:linear-gradient(90deg,var(--steps2),var(--steps))"></i></div>
        <div class="hint">目标 ${fmtN(STEP_GOAL)} · 完成 ${Math.round(stepPct)}%</div>
      </div>
      <div class="card" data-day="${TODAY}">
        <h2><span>心率</span><span class="tag">${t.hr_min ?? '--'}–${t.hr_max ?? '--'}</span></h2>
        <div class="big" style="font-size:27px">${t.hr_avg ?? '--'}<small>平均 bpm</small></div>
        <div class="hint">静息 <b style="color:var(--ink);font-weight:600">${t.resting_hr ?? '--'}</b> bpm · ${hrTone(t.resting_hr)}</div>
      </div>
    </div>

    ${trendCard()}
    ${calendarCard()}
  `;
  bind();
}

/* ---------------- 7 天趋势 ---------------- */
function trendCard(){
  const arr = [];
  for (let i = 6; i >= 0; i--){
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate()-i);
    arr.push(dayMap[iso(d)] || {day: iso(d)});
  }
  const maxS = Math.max(...arr.map(d => d.steps || 0), 1);
  const maxZ = Math.max(...arr.map(d => d.sleep_hours || 0), 1);
  const withS = arr.filter(d => d.steps);
  const withZ = arr.filter(d => d.sleep_hours);
  const avgS = withS.length ? Math.round(withS.reduce((a,b)=>a+b.steps,0)/withS.length) : null;
  const avgZ = withZ.length ? withZ.reduce((a,b)=>a+b.sleep_hours,0)/withZ.length : null;

  const bars = (key, max, cls) => `
    <div class="bars">${arr.map(d => {
      const v = d[key] || 0;
      // 睡眠用 4h~9h 的区间映射，否则各天都是"满格"看不出差异
      const h = v ? (key === 'sleep_hours'
        ? Math.min(100, Math.max((v - 4) / 5 * 100, 10))
        : Math.max(v / max * 100, 6)) : 3;
      const label = key === 'steps' ? (v ? Math.round(v/1000*10)/10 + 'k' : '') : (v ? v.toFixed(1) : '');
      return `<div class="bcol ${cls} ${v ? '' : 'empty'}" data-day="${d.day}">
        <span class="v">${label}</span>
        <div class="b" style="height:${h}%"></div></div>`;
    }).join('')}</div>
    <div class="axis">${arr.map(d => `<span>${WEEK[parseISO(d.day).getDay()].slice(1)}</span>`).join('')}</div>`;

  return `
    <div class="card">
      <h2><span>最近 7 天</span><span class="tag">点柱子看当天明细</span></h2>
      <div style="font-size:11.5px;color:var(--muted);margin:2px 0 2px">步数</div>
      ${bars('steps', maxS, '')}
      <div style="font-size:11.5px;color:var(--muted);margin:14px 0 2px">睡眠（小时）</div>
      ${bars('sleep_hours', maxZ, 'sleep')}
      <div class="avgrow">
        <div class="avg"><em>7 天平均步数</em><b>${fmtN(avgS)} <span style="font-size:11px;color:var(--muted)">步</span></b></div>
        <div class="avg"><em>7 天平均睡眠</em><b>${avgZ == null ? '--' : avgZ.toFixed(1)} <span style="font-size:11px;color:var(--muted)">小时</span></b></div>
      </div>
    </div>`;
}

/* ---------------- 月历 ---------------- */
function calendarCard(){
  const first = new Date(calYear, calMonth, 1);
  const days = new Date(calYear, calMonth+1, 0).getDate();
  const lead = first.getDay();
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push('');
  for (let d = 1; d <= days; d++) cells.push(d);

  const monthDays = cells.filter(Boolean).map(d => dayMap[`${calYear}-${pad(calMonth+1)}-${pad(d)}`]).filter(Boolean);
  const withS = monthDays.filter(d => d.steps);
  const withZ = monthDays.filter(d => d.sleep_hours);
  const avgS = withS.length ? Math.round(withS.reduce((a,b)=>a+b.steps,0)/withS.length) : null;
  const avgZ = withZ.length ? withZ.reduce((a,b)=>a+b.sleep_hours,0)/withZ.length : null;
  const maxS = Math.max(...withS.map(d=>d.steps), 1);
  const goalDays = withS.filter(d => d.steps >= STEP_GOAL).length;

  const body = cells.map(n => {
    if (!n) return '<div></div>';
    const key = `${calYear}-${pad(calMonth+1)}-${pad(n)}`;
    const rec = dayMap[key];
    const isFuture = key > TODAY;
    const pct = rec && rec.steps ? Math.max(8, Math.min(100, rec.steps / maxS * 100)) : 0;
    return `<button class="cell ${rec && rec.has_data ? '' : 'dim'} ${isFuture ? 'future' : ''} ${key === TODAY ? 'today' : ''} ${key === selectedDay ? 'sel' : ''}"
        data-day="${key}">
      <span class="d">${n}</span>
      <span class="s">${rec && rec.steps ? Math.round(rec.steps/1000*10)/10 + 'k' : ''}</span>
      ${pct ? `<span class="fill" style="height:${pct}%"></span>` : ''}
      ${rec && rec.sleep_hours ? '<span class="moon"></span>' : ''}
    </button>`;
  }).join('');

  return `
    <div class="card">
      <div class="calhead">
        <button class="calnav" data-nav="-1" style="border:none;background:var(--chip);width:30px;height:30px;border-radius:10px;color:var(--ink);cursor:pointer">‹</button>
        <div class="m">${calYear} 年 ${YM[calMonth]}</div>
        <button class="calnav" data-nav="1" style="border:none;background:var(--chip);width:30px;height:30px;border-radius:10px;color:var(--ink);cursor:pointer">›</button>
      </div>
      <div class="wd">${['日','一','二','三','四','五','六'].map(w=>`<span>${w}</span>`).join('')}</div>
      <div class="cal">${body}</div>
      <div class="mstats">
        <div class="mstat"><em>日均步数</em><b>${fmtN(avgS)}</b></div>
        <div class="mstat"><em>日均睡眠</em><b>${avgZ == null ? '--' : avgZ.toFixed(1)}<span style="font-size:10px">h</span></b></div>
        <div class="mstat"><em>达标天数</em><b>${goalDays}</b></div>
      </div>
      <div class="hint" style="margin-top:10px">左边橙条是当天步数占比，右上蓝点是当天有睡眠记录</div>
    </div>`;
}

/* ---------------- 详情弹层 ---------------- */
const STAGE = {
  deep:  ['深睡', '#4550b8'],
  core:  ['核心', '#6c7cf0'],
  rem:   ['快速眼动', '#9aa6ff'],
  awake: ['清醒', '#e8a24a'],
  inBed: ['卧床', '#b9c2d4'],
};
const hmText = h => { const hh = Math.floor(h), mm = Math.round((h - hh) * 60); return `${hh} 小时 ${mm} 分`; };
const clockOf = s => {
  const m = String(s || '').match(/(\d{2}):(\d{2})/);
  return m ? `${m[1]}:${m[2]}` : null;
};

function openSheet(key){
  const rec = dayMap[key] || {};
  const d = parseISO(key);
  selectedDay = key;

  const row = (k, v, unit, color) => `<div class="drow">
    <span class="k">${color ? `<i class="kdot" style="background:${color}"></i>` : ''}${k}</span>
    <span class="v">${v}${unit ? `<small>${unit}</small>` : ''}</span></div>`;
  const sec = (title, rows) => rows.length
    ? `<div class="sec"><div class="sec-t">${title}</div>${rows.join('')}</div>` : '';

  /* 睡眠 */
  const sleepRows = [];
  if (rec.sleep_hours != null) sleepRows.push(row('总睡眠时长', hmText(rec.sleep_hours), '', 'var(--sleep)'));
  const st = rec.sleep_stages || {};
  const stSum = Object.values(st).filter(v => typeof v === 'number').reduce((a, b) => a + b, 0);
  if (stSum > 0){
    ['deep', 'core', 'rem', 'awake'].forEach(k => {
      const v = st[k];
      if (typeof v !== 'number' || v <= 0) return;
      sleepRows.push(row(STAGE[k][0], hmText(v), `占 ${Math.round(v / stSum * 100)}%`, STAGE[k][1]));
    });
  }
  const w = rec.sleep_window;
  if (Array.isArray(w) && w.length === 2){
    const a = clockOf(w[0]), b = clockOf(w[1]);
    if (a && b) sleepRows.push(row('入睡 – 起床', `${a} – ${b}`, ''));
  }

  /* 心率 */
  const hrRows = [];
  if (rec.hr_avg != null) hrRows.push(row('平均心率', rec.hr_avg, 'bpm', 'var(--hr)'));
  if (rec.hr_min != null && rec.hr_max != null)
    hrRows.push(row('区间', `${rec.hr_min} – ${rec.hr_max}`, 'bpm', ''));
  if (rec.resting_hr != null) hrRows.push(row('静息心率', rec.resting_hr, 'bpm', ''));

  /* 活动 */
  const actRows = [];
  if (rec.steps != null) actRows.push(row('步数', fmtN(rec.steps), '步', 'var(--steps)'));
  const ACTIVITY = ['active_energy', 'walking_running_distance', 'flights_climbed'];
  const others = [];
  Object.entries(rec.extras || {}).forEach(([k, v]) => {
    const m = EXTRA_META[k] || { n: k, u: '' };
    const r = row(m.n, fmtN(v), m.u, '');
    (ACTIVITY.includes(k) ? actRows : others).push(r);
  });

  const body = sec('睡眠', sleepRows) + sec('心率', hrRows) +
               sec('活动', actRows) + sec('其他', others);
  const empty = !sleepRows.length && !hrRows.length && !actRows.length && !others.length;

  $('#sheetBody').innerHTML = `
    <h3>${d.getMonth() + 1} 月 ${d.getDate()} 日 · ${WEEK[d.getDay()]}</h3>
    <div class="when">${rec.updated_at ? '数据更新于 ' + rec.updated_at : '这一天没有数据'}</div>
    ${empty ? '<div class="empty-note">这一天还没有收到数据</div>' : body}`;
  $('#sheet').classList.add('on');
  $('#mask').classList.add('on');
}
function closeSheet(){
  $('#sheet').classList.remove('on');
  $('#mask').classList.remove('on');
  selectedDay = null;
}

/* ---------------- 交互 ---------------- */
function bind(){
  document.querySelectorAll('[data-day]').forEach(el => {
    el.addEventListener('click', () => openSheet(el.dataset.day));
  });
  document.querySelectorAll('.calnav').forEach(el => {
    el.addEventListener('click', async e => {
      e.stopPropagation();
      calMonth += Number(el.dataset.nav);
      if (calMonth < 0){ calMonth = 11; calYear--; }
      if (calMonth > 11){ calMonth = 0; calYear++; }
      await ensureMonth();
      renderToday();
    });
  });
}
$('#mask').addEventListener('click', closeSheet);

async function ensureMonth(){
  const start = `${calYear}-${pad(calMonth+1)}-01`;
  const last = new Date(calYear, calMonth+1, 0).getDate();
  const end = `${calYear}-${pad(calMonth+1)}-${pad(last)}`;
  if (covered(start, end) || end > TODAY && start <= TODAY) {
    const s2 = start > TODAY ? null : start;
    if (!s2) return;
  }
  const from = start, to = end > TODAY ? TODAY : end;
  if (from > to) return;
  if (covered(from, to)) return;
  await fetchRange(from, to);
}

/* ---------------- 启动 ---------------- */
async function init(){
  if (!TOKEN){
    $('#app').innerHTML = `<div class="card state"><div class="emo">🔒</div>
      <p>链接缺少访问口令。<br>请用带 <code>?token=</code> 的完整链接打开。</p></div>`;
    $('#updated').textContent = '缺少口令';
    return;
  }
  try{
    const s = iso(new Date(today.getFullYear(), today.getMonth(), today.getDate()-34));
    await fetchRange(s, TODAY);
    await ensureMonth();
    renderToday();
    // 支持 #d=2026-11-20 直接打开某一天的详情（方便分享/收藏）
    const m = location.hash.match(/^#d=(\d{4}-\d{2}-\d{2})$/);
    if (m) openSheet(m[1]);
  }catch(e){
    const auth = e.message === 'AUTH';
    $('#app').innerHTML = `<div class="card state"><div class="emo">${auth?'🔒':'📡'}</div>
      <p>${auth ? '口令不对，请用完整的带 token 链接打开。'
               : '读取失败：' + e.message + '<br><span style="font-size:12px">免费实例冷启动可能要等 30–60 秒，稍后刷新。</span>'}</p></div>`;
    $('#updated').textContent = auth ? '口令错误' : '连接异常';
  }
}
/* ---------------- PWA：装到桌面 ---------------- */
(function setupPWA(){
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = '/manifest.webmanifest?token=' + encodeURIComponent(TOKEN || '');
  document.head.appendChild(link);

  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }

  const bar = $('#installBar');
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const installed = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const dismissed = localStorage.getItem('install-bar-dismissed') === '1';
  let deferred = null;

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferred = e;
    if (!installed && !dismissed) bar.hidden = false;
  });

  $('#installGo').addEventListener('click', async () => {
    if (isIOS){
      alert('点下面的「分享」按钮 → 选「添加到主屏幕」\n\n（图标会出现在桌面，点开全屏无地址栏）');
    } else if (deferred){
      deferred.prompt();
      try { await deferred.userChoice; } catch(e){}
      deferred = null;
    } else {
      alert('在浏览器菜单里选「添加到主屏幕 / 安装应用」即可');
    }
    bar.hidden = true;
  });
  $('#installNo').addEventListener('click', () => {
    bar.hidden = true;
    localStorage.setItem('install-bar-dismissed', '1');
  });

  // iOS 没有 beforeinstallprompt，主动提示一次
  if (isIOS && !installed && !dismissed){
    setTimeout(() => { bar.hidden = false; $('#installGo').textContent = '怎么装'; }, 1600);
  }
})();

init();
</script>
</body>
</html>
