<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f8fb">
<title>健康日报</title>
<style>
  :root{
    --bg:#f6f8fb; --card:#ffffff; --ink:#1a2330; --muted:#7b8798; --line:#eef1f6;
    --sleep:#6c7cf0; --steps:#f2994a; --hr:#eb5a5a; --ok:#38b48b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:radial-gradient(120% 60% at 50% 0%,#eef3ff 0%,var(--bg) 55%);
    color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Segoe UI",Roboto,sans-serif;
    padding:max(18px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    min-height:100vh;
  }
  .wrap{max-width:460px;margin:0 auto}
  header{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 2px 16px}
  h1{font-size:21px;margin:0;letter-spacing:-.3px}
  .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .live{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(56,180,139,.14)}
  .card{background:var(--card);border-radius:18px;padding:16px 16px 15px;
    box-shadow:0 1px 2px rgba(23,43,77,.05),0 8px 24px -12px rgba(23,43,77,.16);margin-bottom:12px}
  .card h2{font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 10px;letter-spacing:.4px;display:flex;justify-content:space-between;align-items:center}
  .big{font-size:34px;font-weight:650;letter-spacing:-1px;line-height:1.1;font-variant-numeric:tabular-nums}
  .big small{font-size:14px;font-weight:500;color:var(--muted);margin-left:3px;letter-spacing:0}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .grid .card{margin:0}
  .row{display:flex;align-items:baseline;gap:8px}
  .tag{font-size:11px;padding:1px 7px;border-radius:20px;background:#f3f5fa;color:var(--muted)}
  .bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:11px}
  .bar > i{display:block;height:100%;border-radius:8px;transition:width .5s ease}
  .hrline{margin-top:4px}
  svg{display:block;width:100%;overflow:visible}
  .axis{display:flex;justify-content:space-between;font-size:10.5px;color:#a6b0bf;margin-top:4px}
  .legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-top:8px}
  .legend i{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}
  .state{text-align:center;padding:44px 20px}
  .state .emo{font-size:30px}
  .state p{color:var(--muted);font-size:13.5px;margin:10px 0 0;line-height:1.7}
  code{background:#f3f5fa;padding:1px 5px;border-radius:5px;font-size:12px}
  footer{text-align:center;font-size:11px;color:#aab3c0;margin-top:16px;line-height:1.8}
  .skeleton{height:14px;border-radius:8px;background:linear-gradient(90deg,#f1f4f9 25%,#e8edf5 37%,#f1f4f9 63%);
    background-size:400% 100%;animation:sk 1.3s ease infinite}
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="greet">今天的状态</h1>
      <div class="sub" id="todayLabel">—</div>
    </div>
    <div class="live"><span class="dot"></span><span id="updated">同步中</span></div>
  </header>

  <div id="app">
    <div class="card"><div class="skeleton" style="width:40%"></div>
      <div class="skeleton" style="width:62%;height:30px;margin-top:12px"></div></div>
    <div class="grid">
      <div class="card"><div class="skeleton" style="width:55%"></div>
        <div class="skeleton" style="width:75%;height:26px;margin-top:12px"></div></div>
      <div class="card"><div class="skeleton" style="width:55%"></div>
        <div class="skeleton" style="width:75%;height:26px;margin-top:12px"></div></div>
    </div>
  </div>

  <footer>
    数据来自 Apple Watch，经 iPhone 自动上报<br>
    <span id="footNote">仅本人可见，请勿转发链接</span>
  </footer>
</div>

<script>
const TOKEN = new URLSearchParams(location.search).get('token');
const q = TOKEN ? ('?token=' + encodeURIComponent(TOKEN)) : '';
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const week = ['周日','周一','周二','周三','周四','周五','周六'];

function fmtSleep(h){
  if (h == null) return ['--',''];
  const hh = Math.floor(h), mm = Math.round((h - hh) * 60);
  return [hh + ' 小时', mm + ' 分'];
}
function fmtNum(n){ return n == null ? '--' : n.toLocaleString('zh-CN'); }

/* ---------- 迷你柱状图 ---------- */
function bars(data, key, color, height){
  const vals = data.map(d => d[key] || 0);
  const max = Math.max(...vals, 1);
  const w = 100 / data.length;
  let s = `<svg viewBox="0 0 100 ${height}" preserveAspectRatio="none" height="${height}">`;
  data.forEach((d, i) => {
    const v = d[key] || 0;
    const h = Math.max(v / max * (height - 4), v > 0 ? 3 : 2);
    const x = i * w + w * 0.22, bw = w * 0.56;
    s += `<rect x="${x}" y="${height - h}" width="${bw}" height="${h}" rx="1.6"
           fill="${v > 0 ? color : '#eef1f6'}"/>`;
  });
  return s + '</svg>';
}
/* ---------- 心率折线 ---------- */
function line(data, height){
  const pts = data.map((d, i) => ({x: i, y: d.hr_avg})).filter(p => p.y != null);
  if (pts.length < 2) return `<div class="hint">心率数据还不够画趋势</div>`;
  const ys = pts.map(p => p.y), lo = Math.min(...ys) - 6, hi = Math.max(...ys) + 6;
  const W = 100, H = height;
  const px = p => (p.x / Math.max(data.length - 1, 1)) * W;
  const py = p => H - ((p.y - lo) / (hi - lo)) * (H - 6) - 3;
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${px(p).toFixed(2)},${py(p).toFixed(2)}`).join(' ');
  const area = line + ` L${px(pts[pts.length-1]).toFixed(2)},${H} L${px(pts[0]).toFixed(2)},${H} Z`;
  let dots = pts.map(p => `<circle cx="${px(p).toFixed(2)}" cy="${py(p).toFixed(2)}" r="1.5" fill="#eb5a5a"/>`).join('');
  return `<svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" height="${H}">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eb5a5a" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#eb5a5a" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#g)"/>
    <path d="${line}" fill="none" stroke="#eb5a5a" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${dots}
  </svg>`;
}

function render(d){
  const t = d.today || {};
  const days = d.days || [];
  const dt = new Date(t.day + 'T00:00:00');
  $('#todayLabel').textContent = `${dt.getMonth()+1} 月 ${dt.getDate()} 日 · ${week[dt.getDay()]}`;
  $('#updated').textContent = d.updated_at ? '更新 ' + d.updated_at.slice(5, 16) : '暂无数据';

  const [sh, sm] = fmtSleep(t.sleep_hours);
  const goal = 8;
  const sleepPct = t.sleep_hours ? Math.min(t.sleep_hours / goal * 100, 100) : 0;
  const stepGoal = 8000, stepPct = t.steps ? Math.min(t.steps / stepGoal * 100, 100) : 0;
  const has = t.sleep_hours || t.steps || t.hr_avg;

  if (!has){
    $('#app').innerHTML = `<div class="card state">
      <div class="emo">🌙</div>
      <p>还没有收到今天的数据。<br>
      等 iPhone 下次自动上报后刷新即可。<br>
      <span style="font-size:12px">（或者现在点一下快捷指令里的「发送健康数据」）</span></p>
    </div>`;
    return;
  }

  const prevSleep = days.length > 1 ? days[days.length - 2].sleep_hours : null;
  const diff = (t.sleep_hours != null && prevSleep != null) ? (t.sleep_hours - prevSleep) : null;
  const diffTxt = diff == null ? '昨夜数据' :
    (diff >= 0 ? `比前天多睡 ${Math.round(diff * 60)} 分钟` : `比前天少睡 ${Math.round(-diff * 60)} 分钟`);

  $('#app').innerHTML = `
    <div class="card">
      <h2><span>昨晚睡眠</span><span class="tag">目标 ${goal} 小时</span></h2>
      <div class="big">${sh}${sm ? `<small>${sm}</small>` : ''}</div>
      <div class="bar"><i style="width:${sleepPct}%;background:linear-gradient(90deg,#8b95f5,#6c7cf0)"></i></div>
      <div class="hint">${diffTxt}</div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>步数</h2>
        <div class="big" style="font-size:27px">${fmtNum(t.steps)}<small>步</small></div>
        <div class="bar"><i style="width:${stepPct}%;background:linear-gradient(90deg,#ffb56b,#f2994a)"></i></div>
      </div>
      <div class="card">
        <h2>静息心率</h2>
        <div class="big" style="font-size:27px">${t.resting_hr ?? '--'}<small>bpm</small></div>
        <div class="hint">${t.resting_hr ? (t.resting_hr < 60 ? '偏低，睡得不错' : t.resting_hr <= 75 ? '正常范围' : '偏高，留意休息') : '手表未记录'}</div>
      </div>
    </div>

    <div class="card">
      <h2><span>心率</span><span class="tag">今日 ${t.hr_min ?? '--'}–${t.hr_max ?? '--'} bpm</span></h2>
      <div class="row" style="margin-bottom:8px">
        <div class="big" style="font-size:29px">${t.hr_avg ?? '--'}<small>平均 bpm</small></div>
      </div>
      <div class="hrline">${line(days, 46)}</div>
      <div class="axis"><span>${days.length} 天前</span><span>今天</span></div>
    </div>

    <div class="card">
      <h2><span>最近 ${days.length} 天</span><span class="tag">日均</span></h2>
      <div style="font-size:11.5px;color:#7b8798;margin-bottom:6px">步数</div>
      ${bars(days, 'steps', '#f2994a', 44)}
      <div style="font-size:11.5px;color:#7b8798;margin:14px 0 6px">睡眠（小时）</div>
      ${bars(days, 'sleep_hours', '#6c7cf0', 44)}
      <div class="axis">${days.map(d => `<span>${d.day.slice(8)}</span>`).join('')}</div>
      <div class="legend">
        <span><i style="background:#f2994a"></i>步数 ${Math.round(days.reduce((a,b)=>a+(b.steps||0),0)/days.length).toLocaleString()}</span>
        <span><i style="background:#6c7cf0"></i>睡眠 ${(days.reduce((a,b)=>a+(b.sleep_hours||0),0)/days.length).toFixed(1)} h</span>
      </div>
    </div>`;
}

async function load(){
  try{
    const r = await fetch('/api/summary?days=7' + (TOKEN ? '&token=' + encodeURIComponent(TOKEN) : ''));
    if (r.status === 401){
      $('#app').innerHTML = `<div class="card state"><div class="emo">🔒</div>
        <p>链接缺少访问口令。<br>请用带 <code>?token=</code> 的完整链接打开。</p></div>`;
      return;
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    render(await r.json());
  }catch(e){
    $('#app').innerHTML = `<div class="card state"><div class="emo">📡</div>
      <p>读取失败：${e.message}<br><span style="font-size:12px">服务可能正在冷启动，30 秒后再刷新一次。</span></p></div>`;
    $('#updated').textContent = '连接异常';
  }
}
load();
setInterval(load, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
