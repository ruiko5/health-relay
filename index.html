<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="憨憨的健康数据">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<title>憨憨的健康数据</title>
<style>
  :root{
    --bg:#F5F6F8; --card:#FFFFFF; --ink:#111827; --sub:#9CA3AF; --line:#F1F2F4;
    --shadow:0 2px 10px rgba(17,24,39,.06), 0 8px 24px -12px rgba(17,24,39,.10);
    --ring-energy:#FF9500; --ring-steps:#34C759; --ring-move:#007AFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg)}
  body{
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    display:flex;justify-content:center;
    padding:max(10px,env(safe-area-inset-top)) 0 0;
  }
  .app{width:100%;max-width:420px;padding:0 18px calc(28px + env(safe-area-inset-bottom))}

  /* ---------- 顶部 ---------- */
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 6px}
  .iconbtn{width:36px;height:36px;border-radius:50%;border:none;background:transparent;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:#374151}
  .iconbtn:active{background:#ECEEF1}
  h1{font-size:27px;line-height:1.2;font-weight:700;letter-spacing:-.5px;margin:14px 2px 18px}

  /* ---------- 圆环概览 ---------- */
  .hero{background:var(--card);border-radius:20px;box-shadow:var(--shadow);
    padding:18px 18px 16px;margin-bottom:16px;display:flex;align-items:center;gap:14px}
  .rings{width:132px;height:132px;flex:none}
  .legend{flex:1;display:flex;flex-direction:column;gap:10px}
  .leg{display:flex;align-items:center;gap:8px;font-size:14px;color:#4B5563}
  .leg b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
  .leg .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .leg small{color:var(--sub);font-size:12.5px}

  /* ---------- 卡片网格 ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);
    padding:15px 14px 14px;cursor:pointer;transition:transform .12s}
  .card:active{transform:scale(.985)}
  .badge{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
  .badge svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .c-heart{background:#FF3B30}.c-bed{background:#8B7CF6}.c-drop{background:#FF6B6B}
  .c-shoe{background:#34C759}.c-flame{background:#FF9500}.c-person{background:#30C3CF}
  .c-clock{background:#0A84FF}.c-scale{background:#4CD964}
  .card .t{font-size:17px;font-weight:650;letter-spacing:-.2px;line-height:1.3}
  .card .t small{font-size:12.5px;font-weight:500;color:var(--sub);margin-left:2px}
  .card .s{font-size:12.5px;color:var(--sub);margin-top:5px}

  /* ---------- 弹层 ---------- */
  .mask{position:fixed;inset:0;background:rgba(17,24,39,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  .mask.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-radius:22px 22px 0 0;
    padding:10px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(102%);
    transition:transform .24s cubic-bezier(.2,.8,.2,1);max-height:80vh;overflow:auto}
  .sheet.on{transform:translateY(0)}
  .grab{width:38px;height:4px;border-radius:4px;background:#E5E7EB;margin:4px auto 14px}
  .sheet h3{margin:0 0 4px;font-size:18px;font-weight:700}
  .sheet .when{font-size:12.5px;color:var(--sub);margin-bottom:12px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row .k{color:#6B7280;font-size:14px}
  .row .v{font-weight:650;font-variant-numeric:tabular-nums}
  .wrow{display:flex;align-items:center;gap:10px;padding:9px 0}
  .wrow .wi{width:34px;height:34px;border-radius:11px;background:#FFF4E5;display:flex;align-items:center;justify-content:center;flex:none}
  .wrow .wi svg{width:18px;height:18px;stroke:#FF9500;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .wrow .wt{flex:1;min-width:0}
  .wrow .wt b{display:block;font-size:14.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wrow .wt span{font-size:12px;color:var(--sub)}
  .empty{text-align:center;color:var(--sub);font-size:13.5px;padding:26px 0}
  footer{text-align:center;font-size:11.5px;color:#B0B7C3;margin-top:18px;line-height:1.8}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="iconbtn" id="back" aria-label="返回">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="iconbtn" id="gear" aria-label="历史">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33
        1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0
        11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65
        1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0
        114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4
        9v0a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </button>
  </header>

  <h1>憨憨的健康数据</h1>

  <div id="hero"></div>
  <div class="grid" id="grid"></div>

  <footer>数据来自 Apple Watch / vivo 手表 → 苹果健康 → 自动同步<br>点任意卡片查看当天明细</footer>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

<script>
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const GOALS = { energy: 300, steps: 6000, move: 30 };
const dayMap = {};

const ICONS = {
  heart: '<path d="M12 20.3s-7-4.5-8.8-9A5.1 5.1 0 0112 7.7a5.1 5.1 0 018.8 3.6c-1.8 4.5-8.8 9-8.8 9z"/>',
  bed: '<path d="M3 18v-5a2 2 0 012-2h14a2 2 0 012 2v5"/><path d="M3 18h18"/><path d="M7 11V8h5v3"/>',
  drop: '<path d="M12 3.2c3.2 4 5.2 6.6 5.2 9.1a5.2 5.2 0 11-10.4 0c0-2.5 2-5.1 5.2-9.1z"/>',
  shoe: '<ellipse cx="9" cy="8" rx="3" ry="4.2"/><ellipse cx="16" cy="16" rx="3" ry="4.2"/>',
  flame: '<path d="M12 3.2s4.7 4.6 4.7 8.5a4.7 4.7 0 11-9.4 0c0-1.9 1-3.2 2-4.1 0 1.8.9 2.9 1.9 2.9 0-2.9.8-5.6.8-7.3z"/>',
  person: '<circle cx="12" cy="6" r="2.4"/><path d="M12 9v5"/><path d="M7.5 12h9"/><path d="M12 14l-3 6"/><path d="M12 14l3 6"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  scale: '<rect x="4" y="5" width="16" height="14" rx="3"/><path d="M8 5V3.5h8V5"/><path d="M12 12l2-2"/>',
  run: '<circle cx="14" cy="5" r="2"/><path d="M13 8l-3 4 3 2 1 5"/><path d="M10 12l-3 1-1 4"/>'
};
const svgIcon = k => `<svg viewBox="0 0 24 24">${ICONS[k] || ''}</svg>`;
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = new Date();
const TODAY = iso(today);
const monthDay = s => { const d = parseISO(s); return `${d.getMonth() + 1}月${d.getDate()}日`; };
const clock = s => { const m = String(s || '').match(/(\d{2}):(\d{2})/); return m ? `${m[1]}:${m[2]}` : ''; };

async function fetchWarm(url, tries = 8) {
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(url, { cache: 'no-store' });
      if (r.status === 502 || r.status === 503 || r.status === 504) throw new Error('WAKE');
      if (r.status === 401) throw new Error('AUTH');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (e) {
      if (e.message === 'AUTH' || i === tries - 1) throw e;
      await sleep(4000);
    }
  }
}

function latestDay() {
  for (let i = 0; i < 60; i++) {
    const k = iso(new Date(today.getFullYear(), today.getMonth(), today.getDate() - i));
    if (dayMap[k] && dayMap[k].has_data) return dayMap[k];
  }
  return null;
}

function ringSVG(t) {
  const pct = v => Math.max(0, Math.min(1, v));
  const e = pct((t.extras?.active_energy || 0) / GOALS.energy);
  const s = pct((t.steps || 0) / GOALS.steps);
  const m = pct((t.workout_minutes || 0) / GOALS.move);
  const arc = (r, p, color) => {
    const C = 2 * Math.PI * r;
    return `<circle cx="66" cy="66" r="${r}" fill="none" stroke="#F0F1F3" stroke-width="9"/>
            <circle cx="66" cy="66" r="${r}" fill="none" stroke="${color}" stroke-width="9"
              stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}"
              transform="rotate(-90 66 66)"/>`;
  };
  return `<svg class="rings" viewBox="0 0 132 132">
    ${arc(55, e, 'var(--ring-energy)')}
    ${arc(42, s, 'var(--ring-steps)')}
    ${arc(29, m, 'var(--ring-move)')}
  </svg>`;
}

function card(icon, cls, title, unit, sub, dayKey) {
  return `<div class="card" data-day="${dayKey}">
    <div class="badge ${cls}">${svgIcon(icon)}</div>
    <div class="t">${title}${unit ? `<small>${unit}</small>` : ''}</div>
    <div class="s">${sub}</div>
  </div>`;
}

function render() {
  const t = dayMap[TODAY]?.has_data ? dayMap[TODAY] : latestDay();
  if (!t) {
    $('#hero').innerHTML = `<div class="hero"><div class="empty">还没有数据，等手机同步一次</div></div>`;
    $('#grid').innerHTML = '';
    return;
  }
  const ex = t.extras || {};
  const energy = Math.round(ex.active_energy || 0);
  const minutes = Math.round(t.workout_minutes || 0);
  const dayKey = t.day;
  const isToday = t.day === TODAY;
  const subDate = isToday ? '今天' : monthDay(t.day);

  const sleepH = t.sleep_hours;
  const sleepTxt = sleepH == null ? '睡眠' : `睡眠${Math.floor(sleepH)}小时${Math.round((sleepH % 1) * 60)}分`;
  const spo2 = ex.oxygen_saturation != null ? (ex.oxygen_saturation <= 1.5 ? Math.round(ex.oxygen_saturation * 100) : Math.round(ex.oxygen_saturation)) : null;
  const weight = ex.weight ?? ex.body_mass ?? null;
  const flights = ex.flights_climbed != null ? Math.round(ex.flights_climbed) : null;

  $('#hero').innerHTML = `<div class="hero">
    ${ringSVG(t)}
    <div class="legend">
      <div class="leg"><span class="dot" style="background:#FF9500"></span>
        <b>${energy}</b><span>/ ${GOALS.energy}千卡</span></div>
      <div class="leg"><span class="dot" style="background:#34C759"></span>
        <b>${t.steps ?? 0}</b><span>/ ${GOALS.steps}步</span></div>
      <div class="leg"><span class="dot" style="background:#007AFF"></span>
        <b>${minutes}</b><span>/ ${GOALS.move}分</span></div>
    </div>
  </div>`;

  $('#grid').innerHTML = [
    card('heart', 'c-heart', t.hr_avg != null ? `心率${t.hr_avg}` : '心率', '次/分', t.hr_avg != null ? subDate : '暂无数据', dayKey),
    card('bed', 'c-bed', sleepTxt, '', sleepH != null ? subDate : '暂无数据', dayKey),
    card('drop', 'c-drop', spo2 != null ? `血氧${spo2}` : '血氧', spo2 != null ? '%' : '', spo2 != null ? subDate : '暂无数据', dayKey),
    card('shoe', 'c-shoe', t.steps != null ? `步数${t.steps}` : '步数', t.steps != null ? '步' : '', t.steps != null ? subDate : '暂无数据', dayKey),
    card('flame', 'c-flame', minutes ? `运动${minutes}` : '运动', minutes ? '分钟' : '',
      minutes ? `${(t.workouts || []).length} 次训练` : '暂无数据', dayKey),
    card('person', 'c-person', energy ? `活动${energy}` : '活动能量', energy ? '千卡' : '',
      energy ? subDate : '暂无数据', dayKey),
    card('clock', 'c-clock', flights != null ? `爬楼${flights}` : '爬楼层数', flights != null ? '层' : '',
      flights != null ? subDate : '暂无数据', dayKey),
    card('scale', 'c-scale', weight != null ? `体重${weight}` : '体重', weight != null ? 'kg' : '',
      weight != null ? subDate : '暂无数据', dayKey),
  ].join('');
}

/* ---------- 详情弹层 ---------- */
function openSheet(key) {
  const rec = dayMap[key] || {};
  const d = parseISO(key);
  const rows = [];
  const row = (k, v) => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  if (rec.sleep_hours != null) {
    const w = rec.sleep_window;
    rows.push(row('睡眠', `${Math.floor(rec.sleep_hours)}小时${Math.round((rec.sleep_hours % 1) * 60)}分` +
      (w ? ` · ${clock(w[0])}–${clock(w[1])}` : '')));
  }
  if (rec.hr_avg != null) rows.push(row('心率', `${rec.hr_avg} 次/分（${rec.hr_min}–${rec.hr_max}）`));
  if (rec.steps != null) rows.push(row('步数', `${rec.steps} 步`));
  if (rec.workout_minutes) rows.push(row('运动', `${Math.round(rec.workout_minutes)} 分钟`));
  const ex = rec.extras || {};
  if (ex.active_energy != null) rows.push(row('活动能量', `${Math.round(ex.active_energy)} 千卡`));
  if (ex.basal_energy_burned != null) rows.push(row('基础代谢', `${Math.round(ex.basal_energy_burned)} 千卡`));
  if (ex.walking_running_distance != null) rows.push(row('步行距离', `${Math.round(ex.walking_running_distance * 10) / 10} 公里`));
  if (ex.oxygen_saturation != null) {
    const v = ex.oxygen_saturation <= 1.5 ? Math.round(ex.oxygen_saturation * 100) : Math.round(ex.oxygen_saturation);
    rows.push(row('血氧', `${v}%`));
  }
  if (ex.flights_climbed != null) rows.push(row('爬楼', `${Math.round(ex.flights_climbed)} 层`));

  const workouts = (rec.workouts || []).map(w => `
    <div class="wrow">
      <div class="wi">${svgIcon('run')}</div>
      <div class="wt"><b>${w.name}</b>
        <span>${clock(w.start)}–${clock(w.end)} · ${Math.round(w.minutes)} 分钟${w.energy ? ` · ${Math.round(w.energy)} 千卡` : ''}</span>
      </div>
    </div>`).join('');

  $('#sheetBody').innerHTML = `
    <h3>${d.getMonth() + 1} 月 ${d.getDate()} 日</h3>
    <div class="when">${rec.updated_at ? '更新于 ' + rec.updated_at : '暂无数据'}</div>
    ${workoutsBlock(workouts)}
    ${rows.length ? rows.join('') : '<div class="empty">这一天还没有数据</div>'}`;
  $('#sheet').classList.add('on');
  $('#mask').classList.add('on');
}
const workoutsBlock = html => html ? `<div style="margin:6px 0 10px">${html}</div>` : '';

function closeSheet() {
  $('#sheet').classList.remove('on');
  $('#mask').classList.remove('on');
}

document.addEventListener('click', e => {
  const c = e.target.closest('[data-day]');
  if (c) openSheet(c.dataset.day);
});
$('#mask').addEventListener('click', closeSheet);
$('#back').addEventListener('click', () => history.length > 1 ? history.back() : null);
$('#gear').addEventListener('click', () => {
  const keys = Object.keys(dayMap).filter(k => dayMap[k].has_data).sort().reverse().slice(0, 7);
  $('#sheetBody').innerHTML = `<h3>最近 7 天</h3><div class="when">点某一天看明细</div>` +
    keys.map(k => `<div class="row" data-day="${k}" style="cursor:pointer">
        <span class="k">${monthDay(k)}</span>
        <span class="v">${dayMap[k].steps ?? '--'} 步 · ${dayMap[k].sleep_hours ? dayMap[k].sleep_hours.toFixed(1) + ' h' : '--'}</span>
      </div>`).join('');
  $('#sheet').classList.add('on');
  $('#mask').classList.add('on');
});

/* ---------- PWA ---------- */
(function setupPWA() {
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = '/manifest.webmanifest?token=' + encodeURIComponent(TOKEN || '');
  document.head.appendChild(link);
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }
})();

/* ---------- 启动 ---------- */
(async function init() {
  if (!TOKEN) {
    $('#hero').innerHTML = `<div class="hero"><div class="empty">链接缺少口令。<br>请用带 ?token= 的完整链接打开</div></div>`;
    return;
  }
  try {
    const start = iso(new Date(today.getFullYear(), today.getMonth(), today.getDate() - 34));
    const data = await fetchWarm(`/api/days?start=${start}&end=${TODAY}&token=${encodeURIComponent(TOKEN)}`);
    (data.days || []).forEach(d => { dayMap[d.day] = d; });
    render();
  } catch (e) {
    $('#hero').innerHTML = `<div class="hero"><div class="empty">${
      e.message === 'AUTH' ? '口令不对，请用完整链接打开' : '正在唤醒服务，稍后自动重试…'}</div></div>`;
    setTimeout(() => location.reload(), 8000);
  }
})();
</script>
</body>
</html>
