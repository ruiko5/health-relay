<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="憨憨的健康数据">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<title>憨憨的健康数据</title>
<style>
  :root{
    --bg:#F2F2F7; --card:#fff; --ink:#000; --sub:#8E8E93; --sub2:#C7C7CC;
    --sep:#E5E5EA; --red:#FF3B30; --green:#34C759; --blue:#007AFF;
    --purple:#AF52DE; --orange:#FF9500; --teal:#30B0C7; --pink:#FF2D55;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 16px -6px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg)}
  body{font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
    color:var(--ink);display:flex;justify-content:center;
    padding:max(8px,env(safe-area-inset-top)) 0 0}
  .app{width:100%;max-width:420px;padding:0 16px calc(30px + env(safe-area-inset-bottom))}
  .view{display:none}
  .view.on{display:block;animation:in .22s ease}
  @keyframes in{from{transform:translateY(5px)}to{transform:none}}

  /* 导航 */
  .nav{display:flex;align-items:center;gap:6px;min-height:44px}
  .nav .back{display:flex;align-items:center;gap:2px;color:var(--blue);font-size:17px;
    background:none;border:none;padding:6px 2px;cursor:pointer}
  .nav .right{margin-left:auto}
  
  h1.large{font-size:34px;font-weight:700;letter-spacing:-.7px;margin:6px 0 14px}
  h2.title{font-size:17px;font-weight:600;margin:0}
  .group-title{font-size:13px;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;
    margin:22px 4px 8px;font-weight:500}

  /* 日期条 */
  .strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  .strip::-webkit-scrollbar{display:none}
  .dchip{flex:none;width:44px;padding:7px 0 6px;border-radius:13px;background:#fff;border:none;
    box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:2px;
    cursor:pointer;transition:transform .12s}
  .dchip:active{transform:scale(.95)}
  .dchip .w{font-size:10.5px;color:var(--sub)}
  .dchip .n{font-size:12.5px;font-weight:600;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
  .dchip .dot{width:4px;height:4px;border-radius:50%;background:var(--green);margin-top:2px;opacity:0}
  .dchip.has .dot{opacity:1}
  .dchip.sel{background:#000;color:#fff}
  .dchip.sel .w{color:rgba(255,255,255,.65)}
  .dchip.sel .dot{background:#fff}

  /* 卡片 */
  .card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);
    padding:16px;cursor:pointer;transition:transform .12s}
  .card:active{transform:scale(.95)}
  .hero{display:flex;align-items:center;gap:12px;cursor:default}
  .hero:active{transform:none}
  .rings{width:130px;height:130px;flex:none}
  .legend{flex:1;display:flex;flex-direction:column;gap:11px}
  .leg{display:flex;align-items:baseline;gap:7px;font-size:15px;color:#3A3A3C}
  .leg .k{font-size:13px;color:var(--sub);width:52px;flex:none}
  .leg b{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}
  .leg span{color:var(--sub);font-size:13px}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;align-self:center}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile .ico{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    margin-bottom:10px}
  .tile .ico svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tile .h{font-size:15px;color:var(--sub);display:flex;align-items:center;gap:5px}
  .tile .v{font-size:26px;font-weight:700;letter-spacing:-.6px;margin-top:2px;font-variant-numeric:tabular-nums}
  .tile .v small{font-size:13px;font-weight:500;color:var(--sub);margin-left:2px;letter-spacing:0}
  .tile .s{font-size:12.5px;color:var(--sub);margin-top:3px}

  /* 详情 */
  .bigstat{display:flex;align-items:flex-end;gap:10px;margin:6px 0 2px}
  .bigstat .r{font-size:40px;font-weight:700;letter-spacing:-1.4px;line-height:1}
  .bigstat .r small{font-size:15px;font-weight:500;color:var(--sub);margin-left:4px}
  .bigstat .a{margin-left:auto;text-align:right;font-size:13px;color:var(--sub)}
  .bigstat .a b{display:block;font-size:22px;color:var(--ink);font-weight:650}
  .chartcard{padding:12px 8px 6px}
  .chartcard .cap{font-size:12.5px;color:var(--sub);margin:0 8px 6px}
  .list{background:#fff;border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;
    border-bottom:1px solid var(--sep);font-size:16px}
  .row:last-child{border-bottom:none}
  .row .l{display:flex;align-items:center;gap:10px}
  .row .l svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .row .r{color:var(--sub);font-variant-numeric:tabular-nums}
  .wrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--sep)}
  .wrow:last-child{border-bottom:none}
  .wrow .wi{width:38px;height:38px;border-radius:50%;background:#FFF1E0;display:flex;align-items:center;
    justify-content:center;flex:none}
  .wrow .wi svg{width:20px;height:20px;stroke:var(--orange);fill:none;stroke-width:2;stroke-linecap:round}
  .wrow .wt{flex:1;min-width:0}
  .wrow .wt b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wrow .wt span{font-size:12.5px;color:var(--sub)}
  .empty{text-align:center;color:var(--sub);font-size:14px;padding:26px 8px}
  footer{text-align:center;font-size:11.5px;color:var(--sub2);margin-top:20px;line-height:1.8}
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  .mask.on{opacity:1;pointer-events:auto}

  /* ---- 日历按钮 ---- */
  .calbtn{background:none;border:none;color:var(--blue);display:flex;align-items:center;gap:4px;
    font-size:15px;padding:6px 2px;cursor:pointer}
  .calbtn:active{opacity:.5}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .hrow h1{margin:6px 0 12px}

  /* ---- 日历弹层 ---- */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;
    transition:opacity .22s;z-index:40;backdrop-filter:blur(1px)}
  .mask.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;
    border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(102%);transition:transform .26s cubic-bezier(.22,.8,.24,1);
    max-width:420px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.12)}
  .sheet.on{transform:translateY(0)}
  .grab{width:38px;height:5px;border-radius:5px;background:#E5E5EA;margin:2px auto 12px}
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .calhead b{font-size:18px;font-weight:650;letter-spacing:-.3px}
  .calnav{display:flex;gap:4px}
  .calnav button{width:34px;height:34px;border-radius:50%;border:none;background:#F2F2F7;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:#3A3A3C}
  .calnav button:active{background:#E5E5EA}
  .calweek{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
  .calweek span{text-align:center;font-size:11.5px;color:var(--sub);font-weight:500}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .calday{position:relative;aspect-ratio:1/1;border:none;background:none;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:15.5px;
    font-variant-numeric:tabular-nums;cursor:pointer;color:#1C1C1E}
  .calday.mute{color:#C7C7CC}
  .calday.today{color:var(--blue);font-weight:650}
  .calday.sel{background:#000;color:#fff;font-weight:600}
  .calday.has::after{content:'';position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;
    background:var(--green)}
  .calday.sel::after{background:#fff}
  .calfoot{display:flex;gap:10px;margin-top:12px}
  .calfoot button{flex:1;height:42px;border-radius:12px;border:none;font-size:15.5px;font-weight:550;
    cursor:pointer;background:#F2F2F7;color:#1C1C1E}
  .calfoot button.primary{background:#007AFF;color:#fff}
  .calfoot button:active{opacity:.75}

  /* ---- 图表：纵轴 + 可点击数据点 ---- */
  .chart-wrap{position:relative;padding:0 2px}
  .chart-tip{position:absolute;transform:translate(-50%,-118%);background:rgba(28,28,30,.92);
    color:#fff;font-size:12px;line-height:1.35;padding:6px 9px;border-radius:9px;white-space:nowrap;
    pointer-events:none;opacity:0;transition:opacity .14s;z-index:5;font-variant-numeric:tabular-nums}
  .chart-tip.on{opacity:1}
  .chart-tip::after{content:'';position:absolute;left:50%;bottom:-4px;margin-left:-4px;width:8px;height:8px;
    background:rgba(28,28,30,.92);transform:rotate(45deg)}
  .chart-dot{cursor:pointer}
  .chart-dot .hit{fill:transparent}
  .chart-dot.on circle.pt{fill:#FF3B30;stroke:#fff;stroke-width:2.5}
</style>
</head>
<body>
<div class="app">

  <!-- ================= 主页 ================= -->
  <section class="view on" id="v-home">
    <div class="hrow">
      <h1 class="large">憨憨的健康数据</h1>
      <button class="calbtn" id="cal-home" aria-label="跳到某天">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
          stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/>
          <path d="M8 3v4M16 3v4M3 10h18"/></svg>
      </button>
    </div>
    <div class="strip" id="strip-home"></div>
    <div id="hero-home"></div>
    <div class="grid" id="grid-home" style="margin-top:12px"></div>
    <footer>数据来自 Apple Watch / vivo 手表 → 苹果健康 → 自动同步</footer>
  </section>

  <!-- ================= 心率详情 ================= -->
  <section class="view" id="v-hr">
    <div class="nav">
      <button class="back" data-back>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        返回
      </button>
      <h2 class="title" style="margin-left:8px">心率</h2>
      <button class="right calbtn" id="hr-date" aria-label="跳到某天"></button>
    </div>
    <div class="strip" id="strip-hr" style="margin-top:8px"></div>
    <div id="hr-body"></div>
  </section>

  <!-- ================= 运动详情 ================= -->
  <section class="view" id="v-act">
    <div class="nav">
      <button class="back" data-back>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        返回
      </button>
      <h2 class="title" style="margin-left:8px">运动与活动</h2>
      <button class="right calbtn" id="act-date" aria-label="跳到某天"></button>
    </div>
    <div class="strip" id="strip-act" style="margin-top:8px"></div>
    <div id="act-body"></div>
  </section>
</div>

<div class="mask" id="mask"></div>

<div class="sheet" id="day">
  <div class="grab"></div>
  <div id="day-body"></div>
</div>

<div class="sheet" id="cal">
  <div class="grab"></div>
  <div class="calhead">
    <b id="cal-title">2026年11月</b>
    <div class="calnav">
      <button id="cal-prev" aria-label="上个月">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button id="cal-next" aria-label="下个月">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>
  <div class="calweek"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
  <div class="calgrid" id="cal-grid"></div>
  <div class="calfoot">
    <button id="cal-today">回到今天</button>
    <button class="primary" id="cal-close">完成</button>
  </div>
</div>

<script>
/* ============ 基础 ============ */
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const now = new Date();
const TODAY = iso(now);
const md = s => { const d = parseISO(s); return `${d.getMonth() + 1}月${d.getDate()}日`; };
const wd = s => ['周日','周一','周二','周三','周四','周五','周六'][parseISO(s).getDay()];
const hm = h => h == null ? '--' : `${Math.floor(h)}小时${Math.round((h % 1) * 60)}分`;
const clock = s => { const m = String(s || '').match(/(\d{2}):(\d{2})/); return m ? `${m[1]}:${m[2]}` : ''; };

const GOALS = { energy: 300, steps: 6000, move: 30 };
const dayMap = {};
let selected = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1)); // 默认昨天

const ICONS = {
  heart:'<path d="M12 20.3s-7-4.5-8.8-9A5.1 5.1 0 0112 7.7a5.1 5.1 0 018.8 3.6c-1.8 4.5-8.8 9-8.8 9z"/>',
  bed:'<path d="M3 18v-5a2 2 0 012-2h14a2 2 0 012 2v5"/><path d="M3 18h18"/><path d="M7 11V8h5v3"/>',
  bp:'<path d="M3 12h3l2-5 3 10 2-6 2 3h6"/>',
  shoe:'<ellipse cx="9" cy="8" rx="3" ry="4.2"/><ellipse cx="16" cy="16" rx="3" ry="4.2"/>',
  flame:'<path d="M12 3.2s4.7 4.6 4.7 8.5a4.7 4.7 0 11-9.4 0c0-1.9 1-3.2 2-4.1 0 1.8.9 2.9 1.9 2.9 0-2.9.8-5.6.8-7.3z"/>',
  stand:'<circle cx="12" cy="5.5" r="2.2"/><path d="M12 8v6"/><path d="M8 11h8"/><path d="M12 14l-2.5 6"/><path d="M12 14l2.5 6"/>',
  timer:'<circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 1.5"/><path d="M9 2h6"/>',
  scale:'<rect x="4" y="5" width="16" height="14" rx="3"/><path d="M8 5V3.5h8V5"/><path d="M12 12l2-2"/>',
  run:'<circle cx="14" cy="5" r="2"/><path d="M13 8l-3 4 3 2 1 5"/><path d="M10 12l-3 1-1 4"/>',
  drop:'<path d="M12 3.2c3.2 4 5.2 6.6 5.2 9.1a5.2 5.2 0 11-10.4 0c0-2.5 2-5.1 5.2-9.1z"/>',
  route:'<path d="M6 18h6a3 3 0 000-6H9a3 3 0 010-6h6"/><circle cx="18" cy="6" r="1.8"/><circle cx="6" cy="18" r="1.8"/>',
  stairs:'<path d="M4 20h4v-4h4v-4h4V8h4"/>'
};
const svg = (k, attrs = '') => `<svg viewBox="0 0 24 24" ${attrs}>${ICONS[k] || ''}</svg>`;

/* ============ 数据 ============ */
async function fetchWarm(url, tries = 8) {
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(url, { cache: 'no-store' });
      if (r.status === 502 || r.status === 503 || r.status === 504) throw new Error('WAKE');
      if (r.status === 401) throw new Error('AUTH');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (e) {
      if (e.message === 'AUTH' || i === tries - 1) throw e;
      await sleep(4000);
    }
  }
}

/* ============ 组件 ============ */
function dateStrip(el, onPick, days = 7) {
  // 如果选中的日期比默认范围更早（例如从日历跳到上个月），把范围一起往前扩，
  // 否则会出现「选中了但日期条里没有这一天」
  const selD = parseISO(selected);
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const age = Math.round((todayMid - new Date(selD.getFullYear(), selD.getMonth(), selD.getDate())) / 86400000);
  const span = Math.max(days - 1, Math.max(0, age));
  const items = [];
  for (let i = span; i >= 0; i--) {   // 升序：最左最早，最右今天
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    items.push(iso(d));
  }
  const yday = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1));
  el.innerHTML = items.map(k => {
    const rec = dayMap[k];
    const d = parseISO(k);
    const label = k === TODAY ? '今天' : k === yday ? '昨天' : wd(k);
    // 日期带年月日；不是今年就把年份也写出来
    const dateTxt = (d.getFullYear() !== now.getFullYear() ? `${String(d.getFullYear()).slice(2)}/` : '')
      + `${d.getMonth() + 1}/${d.getDate()}`;
    return `<button class="dchip ${k === selected ? 'sel' : ''} ${rec && rec.has_data ? 'has' : ''}" data-k="${k}">
      <span class="w">${label}</span>
      <span class="n">${dateTxt}</span>
      <span class="dot"></span>
    </button>`;
  }).join('');
  el.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => onPick(b.dataset.k)));
  // 第一次滚到最右；之后只有「选中的日期变了」才把它滚到可见位置（保留用户滑动）
  if (!el.dataset.ready) {
    el.dataset.ready = '1';
    requestAnimationFrame(() => {
      const sel = el.querySelector('.dchip.sel');
      if (sel) sel.scrollIntoView({ inline: 'center', block: 'nearest' });
      else el.scrollLeft = el.scrollWidth;
    });
  } else if (el.dataset.sel !== selected && el.scrollWidth > el.clientWidth + 4) {
    requestAnimationFrame(() => {
      const sel = el.querySelector('.dchip.sel');
      if (sel) sel.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    });
  }
  el.dataset.sel = selected;
}


/**
 * 折线 + 面积图，带纵轴刻度和可点击数据点
 * points: [{ x: 0..1, y: 数值, tip: '点击后显示的文字' }]
 */
function lineChart(points, { color = '#FF3B30', h = 180, unit = 'bpm', labelEvery = 1 } = {}) {
  const pts0 = points.filter(p => p.y != null);
  if (!pts0.length) return '<div class="empty">暂无图表数据</div>';

  const W = 340, padL = 36, padR = 12, padT = 12, padB = 26;
  const ys = pts0.map(p => p.y);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi - lo < 8) { const mid = (hi + lo) / 2; lo = mid - 5; hi = mid + 5; }
  lo = Math.max(0, Math.floor(lo * 0.94 / 10) * 10);
  hi = Math.ceil(hi * 1.04 / 10) * 10;

  const X = p => padL + p.x * (W - padL - padR);
  const Y = v => padT + (1 - (v - lo) / (hi - lo || 1)) * (h - padT - padB);

  const pts = pts0.map(p => ({ x: X(p), y: Y(p.y), tip: p.tip }));

  // 平滑曲线
  let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  const base = h - padB;
  const area = `${d} L${pts[pts.length - 1].x.toFixed(1)},${base} L${pts[0].x.toFixed(1)},${base} Z`;
  const gid = 'g' + Math.random().toString(36).slice(2, 7);

  // 纵轴刻度（4 条）
  const ticks = [0, 1, 2, 3].map(i => lo + ((hi - lo) / 3) * i);
  const grid = ticks.map(v => `
    <line x1="${padL}" y1="${Y(v).toFixed(1)}" x2="${W - padR}" y2="${Y(v).toFixed(1)}"
      stroke="#EDEDF0" stroke-width="1" stroke-dasharray="${v === lo ? 0 : 3} ${v === lo ? 0 : 3}"/>
    <text x="${padL - 7}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end"
      font-size="9.5" fill="#B0B7C3">${Math.round(v)}</text>`).join('');

  const dots = pts.map((p, i) => `
    <g class="chart-dot" data-i="${i}">
      <circle class="hit" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="13"/>
      <circle class="pt" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.2"
        fill="#fff" stroke="${color}" stroke-width="2" data-tip="${(p.tip || '').replace(/"/g, '&quot;')}"/>
    </g>`).join('');

  return `<div class="chart-wrap">
    <svg viewBox="0 0 ${W} ${h}" style="width:100%;height:${h}px;display:block;overflow:visible">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity=".26"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      ${grid}
      <path d="${area}" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
    </svg>
    <div class="chart-tip"></div>
  </div>`;
}

/** 给图表加上「点一下显示数值」 */
function bindChartTips(root) {
  root.querySelectorAll('.chart-wrap').forEach(wrap => {
    const tip = wrap.querySelector('.chart-tip');
    const svg = wrap.querySelector('svg');
    const box = () => wrap.getBoundingClientRect();
    wrap.querySelectorAll('.chart-dot').forEach(dot => {
      const i = Number(dot.dataset.i);
      const circle = dot.querySelector('.pt');
      dot.addEventListener('click', ev => {
        ev.stopPropagation();
        wrap.querySelectorAll('.chart-dot').forEach(d => d.classList.remove('on'));
        dot.classList.add('on');
        // 把 svg 坐标换算成容器像素坐标
        const r = circle.getBoundingClientRect(), b = box();
        tip.innerHTML = circle.dataset.tip || '';
        const cx = r.left - b.left + r.width / 2;
        tip.style.left = Math.max(52, Math.min(cx, b.width - 52)) + 'px';
        tip.style.top = (r.top - b.top) + 'px';
        tip.classList.add('on');
      });
    });
    // 点空白处收起
    wrap.addEventListener('click', () => {
      wrap.querySelectorAll('.chart-dot').forEach(d => d.classList.remove('on'));
      tip.classList.remove('on');
    });
  });
}

/** 统一的「卡路里」口径：健康 App 的活动能量 + 当天运动消耗 */
function totalEnergy(t) {
  return Math.round((t?.extras?.active_energy || 0) + (t?.workout_energy || 0));
}

function ringSVG(t, size = 130) {
  const clamp = v => Math.max(0, Math.min(1, v));
  const e = clamp(totalEnergy(t) / GOALS.energy);
  const s = clamp((t.steps || 0) / GOALS.steps);
  const m = clamp((t.workout_minutes || 0) / GOALS.move);
  const c = size / 2;
  const arc = (r, p, color) => {
    const C = 2 * Math.PI * r;
    return `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#F2F2F7" stroke-width="${size * 0.072}"/>
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${size * 0.072}"
        stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}"
        transform="rotate(-90 ${c} ${c})"/>`;
  };
  return `<svg class="rings" viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px">
    ${arc(size * 0.4166, e, '#FF3B30')}
    ${arc(size * 0.3181, s, '#34C759')}
    ${arc(size * 0.2196, m, '#007AFF')}
  </svg>`;
}

/** 平滑面积图：points = [{x:0..1, y:数值}]，返回 svg 字符串 */
function areaChart(points, { w = 340, h = 130, color = '#FF3B30', min = null, max = null } = {}) {
  if (!points.length) return `<div class="empty">暂无图表数据</div>`;
  const ys = points.map(p => p.y);
  const lo = min != null ? min : Math.min(...ys) * 0.92;
  const hi = max != null ? max : Math.max(...ys) * 1.06;
  const padY = 10;
  const X = p => p.x * (w - 8) + 4;
  const Y = v => h - padY - ((v - lo) / (hi - lo || 1)) * (h - padY * 2);

  const pts = points.map(p => ({ x: X(p), y: Y(p.y) }));
  // Catmull-Rom -> bezier，做平滑
  let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  const area = `${d} L${pts[pts.length - 1].x.toFixed(1)},${h} L${pts[0].x.toFixed(1)},${h} Z`;
  const gid = 'g' + Math.random().toString(36).slice(2, 7);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".28"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.6" fill="#fff" stroke="${color}" stroke-width="2"/>`).join('')}
  </svg>`;
}

/* ============ 主页 ============ */
function latestDay() {
  for (let i = 0; i < 60; i++) {
    const k = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate() - i));

  }
  return null;
}

/* ============ 心率详情 ============ */
function renderHR() {
  const t = dayMap[selected] || {};
  dateStrip($('#strip-hr'), k => { selected = k; renderHR(); });
  $('#hr-date').innerHTML = md(selected) + CAL_ICON;

  if (!t.has_data || t.hr_avg == null) {
    $('#hr-body').innerHTML = `<div class="card" style="margin-top:12px"><div class="empty">这一天没有心率数据</div></div>`;
    return;
  }
  // 用最近 7 天平均值画趋势（当前只存了按天汇总，没有一天内的逐条样本）
  const trend = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(parseISO(selected).getFullYear(), parseISO(selected).getMonth(), parseISO(selected).getDate() - i);
    const k = iso(d);
    if (dayMap[k]?.hr_avg != null) trend.push({ x: (6 - i) / 6, y: dayMap[k].hr_avg, label: md(k) });
  }

  // 优先画「一天内」的小时曲线；没有小时数据（老数据/未开小时分组）就退回 7 天趋势
  const series = (t.hr_series || []).filter(p => p.avg != null);
  const intraday = series.length >= 2;   // 今天刚起床也可能只有 2 个点，仍然按小时画
  let chartHtml, axisHtml;
  if (intraday) {
    const pts = series.map(p => ({
      x: p.h / 23,
      y: p.avg,
      tip: `${String(p.h).padStart(2, '0')}:00 · 平均 ${Math.round(p.avg)} bpm`
        + (p.min != null && p.max != null ? `<br>${Math.round(p.min)}–${Math.round(p.max)}` : '')
    }));
    chartHtml = lineChart(pts, { color: '#FF3B30', h: 180 });
    axisHtml = [0, 6, 12, 18, 23].map(h => `<span>${String(h).padStart(2, '0')}:00</span>`).join('');
  } else {
    const pts = trend.map(p => ({
      x: p.x, y: p.y,
      tip: `${p.label} · 平均 ${Math.round(p.y)} bpm`
    }));
    chartHtml = lineChart(pts, { color: '#FF3B30', h: 180 });
    axisHtml = trend.map(p => `<span>${p.label.split('月')[1].replace('日', '')}</span>`).join('');
  }

  $('#hr-body').innerHTML = `
    <div class="bigstat">
      <div class="r">${t.hr_min ?? '--'}–${t.hr_max ?? '--'}<small>bpm</small></div>
      <div class="a">平均<b>${t.hr_avg ?? '--'}</b></div>
    </div>
    <div class="card chartcard" style="margin-top:12px;cursor:default">
      <div class="cap">${intraday
        ? (series.length < 8 ? `当天心率波动（按小时，已记录 ${series.length} 个小时）` : '当天心率波动（按小时）')
        : '最近 7 天平均心率（当天还没有小时数据）'}</div>
      ${chartHtml}
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#C7C7CC;padding:2px 10px 6px">
        ${axisHtml}
      </div>
    </div>
    <div class="group-title">明细</div>
    <div class="list">
      <div class="row"><span class="l">${svg('heart')}最高心率</span><span class="r">${t.hr_max ?? '--'} bpm</span></div>
      <div class="row"><span class="l">${svg('heart')}最低心率</span><span class="r">${t.hr_min ?? '--'} bpm</span></div>
      <div class="row"><span class="l">${svg('heart')}静息心率</span><span class="r">${t.resting_hr ?? '--'} bpm</span></div>
      <div class="row"><span class="l">${svg('timer')}平均心率</span><span class="r">${t.hr_avg} bpm</span></div>
    </div>`;

  bindChartTips($('#hr-body'));
}

/* ============ 运动详情 ============ */
function renderAct() {
  const t = dayMap[selected] || {};
  dateStrip($('#strip-act'), k => { selected = k; renderAct(); });
  $('#act-date').innerHTML = md(selected) + CAL_ICON;

  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(parseISO(selected).getFullYear(), parseISO(selected).getMonth(), parseISO(selected).getDate() - i);
    const k = iso(d);
    days.push({ k, steps: dayMap[k]?.steps || 0, label: md(k) });
  }
  const trend = days.map((d, i) => ({
    x: i / 6, y: d.steps,
    tip: `${d.label} · ${d.steps.toLocaleString('zh-CN')} 步`
  }));

  const wlist = (t.workouts || []).map(w => {
    const hour = Number((w.start || '').slice(11, 13)) || 0;
    const part = hour < 12 ? '上午' : hour < 18 ? '下午' : '晚上';
    return `<div class="wrow">
      <div class="wi">${svg('run')}</div>
      <div class="wt"><b>${w.name}</b>
        <span>${part} · ${clock(w.start)}–${clock(w.end)} · ${Math.round(w.minutes)} 分钟${w.energy ? ` · ${Math.round(w.energy)} 千卡` : ''}</span>
      </div></div>`;
  }).join('');

  const ex = t.extras || {};
  $('#act-body').innerHTML = `
    <div class="card" style="margin-top:12px;cursor:default">
      <div style="display:flex;align-items:center;gap:14px">
        ${ringSVG(t, 112)}
        <div style="flex:1">
          <div style="font-size:13px;color:var(--sub)">今日步数</div>
          <div style="font-size:30px;font-weight:700;letter-spacing:-.8px">${(t.steps ?? 0).toLocaleString('zh-CN')}<small style="font-size:13px;color:var(--sub);font-weight:500"> 步</small></div>
          <div style="font-size:12.5px;color:var(--sub);margin-top:2px">目标 ${GOALS.steps.toLocaleString('zh-CN')} 步 · ${Math.round(Math.min(100, (t.steps || 0) / GOALS.steps * 100))}%</div>
        </div>
      </div>
    </div>

    <div class="card chartcard" style="margin-top:12px;cursor:default">
      <div class="cap">最近 7 天步数</div>
      ${lineChart(trend, { color: '#34C759', h: 165 })}
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#C7C7CC;padding:2px 10px 6px">
        ${days.map(d => `<span>${d.label}</span>`).join('')}
      </div>
    </div>

    ${wlist ? `<div class="group-title">运动记录</div><div class="list">${wlist}</div>` : ''}

    <div class="group-title">当天数据</div>
    <div class="list">
      <div class="row"><span class="l">${svg('route')}步行距离</span><span class="r">${ex.walking_running_distance != null ? (Math.round(ex.walking_running_distance * 10) / 10) + ' 公里' : '--'}</span></div>
      <div class="row"><span class="l">${svg('stairs')}爬楼层数</span><span class="r">${ex.flights_climbed != null ? Math.round(ex.flights_climbed) + ' 层' : '--'}</span></div>
      <div class="row"><span class="l">${svg('flame')}活动能量</span><span class="r">${(() => {
        const base = ex.active_energy || 0, wo = t.workout_energy || 0;
        if (!base && !wo) return '--';
        return `${Math.round(base + wo)} 千卡` + (wo ? `（含运动 ${Math.round(wo)}）` : '');
      })()}</span></div>
      <div class="row"><span class="l">${svg('timer')}锻炼时长</span><span class="r">${t.workout_minutes ? Math.round(t.workout_minutes) + ' 分钟' : '--'}</span></div>
    </div>`;

  bindChartTips($('#act-body'));
}

/* ============ 视图切换 ============ */
function nav(view) {
  $$('.view').forEach(v => v.classList.remove('on'));
  $('#v-' + view).classList.add('on');
  window.scrollTo({ top: 0 });
  if (view === 'hr') renderHR();
  if (view === 'act') renderAct();
}
$$('[data-back]').forEach(b => b.addEventListener('click', () => nav('home')));



/* ============ 当天明细弹层 ============ */
function openDaySheet(key) {
  const r = dayMap[key];
  if (!r) return;
  const ex = r.extras || {};
  const d = parseISO(key);
  const rows = [];
  const row = (icon, k, v) => `<div class="row"><span class="l">${svg(icon)}${k}</span><span class="r">${v}</span></div>`;

  if (r.sleep_hours != null) {
    const w = r.sleep_window;
    rows.push(row('bed', '睡眠', `${Math.floor(r.sleep_hours)}小时${Math.round((r.sleep_hours % 1) * 60)}分`
      + (w ? ` · ${clock(w[0])}–${clock(w[1])}` : '')));
  }
  if (r.hr_avg != null) rows.push(row('heart', '心率', `${r.hr_avg} 次/分（${r.hr_min ?? '--'}–${r.hr_max ?? '--'}）`));
  if (r.steps != null) rows.push(row('shoe', '步数', `${r.steps.toLocaleString('zh-CN')} 步`));
  if (r.workout_minutes) rows.push(row('timer', '运动', `${Math.round(r.workout_minutes)} 分钟`));
  if (ex.active_energy != null || r.workout_energy) rows.push(row('flame', '卡路里', `${totalEnergy(r)} 千卡`));
  if (ex.walking_running_distance != null) rows.push(row('route', '步行距离', `${Math.round(ex.walking_running_distance * 10) / 10} 公里`));
  if (ex.flights_climbed != null) rows.push(row('stairs', '爬楼', `${Math.round(ex.flights_climbed)} 层`));
  if (ex.oxygen_saturation != null) {
    const v = ex.oxygen_saturation <= 1.5 ? Math.round(ex.oxygen_saturation * 100) : Math.round(ex.oxygen_saturation);
    rows.push(row('drop', '血氧', `${v}%`));
  }
  const weight = ex.weight ?? ex.body_mass;
  if (weight != null) rows.push(row('scale', '体重', `${weight} kg`));

  $('#day-body').innerHTML = `
    <h3 style="margin:2px 0 2px;font-size:19px;font-weight:650">${d.getMonth() + 1} 月 ${d.getDate()} 日</h3>
    <div style="font-size:12.5px;color:#8E8E93;margin-bottom:12px">
      ${r.updated_at ? '更新于 ' + r.updated_at : '暂无同步记录'}
    </div>
    ${rows.length ? `<div class="list" style="box-shadow:none">${rows.join('')}</div>`
                  : '<div class="empty">这一天还没有数据</div>'}
    <div class="calfoot"><button class="primary" id="day-close">完成</button></div>`;

  $('#day').classList.add('on');
  $('#mask').classList.add('on');
  $('#day-close').addEventListener('click', () => {
    $('#day').classList.remove('on');
    $('#mask').classList.remove('on');
  });
}

/* ============ 跳到某天（日历） ============ */
const CAL_ICON = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="margin-left:3px">
  <rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>`;

let calY = now.getFullYear(), calM = now.getMonth();

function showCal() {
  $('#cal').classList.add('on');
  $('#mask').classList.add('on');
}
function closeCal() {
  $('#cal').classList.remove('on');
  $('#mask').classList.remove('on');
}
function openCalendar() {
  const d = parseISO(selected);
  calY = d.getFullYear();
  calM = d.getMonth();
  renderCalendar();
  showCal();
}
function renderCalendar() {
  $('#cal-title').textContent = `${calY}年${calM + 1}月`;
  const startDow = new Date(calY, calM, 1).getDay();
  const total = new Date(calY, calM + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push('');
  for (let d = 1; d <= total; d++) cells.push(iso(new Date(calY, calM, d)));
  while (cells.length % 7) cells.push('');

  $('#cal-grid').innerHTML = cells.map(k => {
    if (!k) return '<span></span>';
    const cls = ['calday'];
    if (k === TODAY) cls.push('today');
    if (k === selected) cls.push('sel');
    if (dayMap[k]?.has_data) cls.push('has');
    return `<button class="${cls.join(' ')}" data-d="${k}">${parseISO(k).getDate()}</button>`;
  }).join('');

  $('#cal-grid').querySelectorAll('[data-d]').forEach(b => {
    b.addEventListener('click', () => {
      selected = b.dataset.d;
      closeCal();
      refreshCurrent();
    });
  });
}

function refreshCurrent() {
  const id = document.querySelector('.view.on')?.id;
  if (id === 'v-hr') renderHR();
  else if (id === 'v-act') renderAct();
  else renderHome();
}

$('#cal-prev').addEventListener('click', () => { calM--; if (calM < 0) { calM = 11; calY--; } renderCalendar(); });
$('#cal-next').addEventListener('click', () => { calM++; if (calM > 11) { calM = 0; calY++; } renderCalendar(); });
$('#cal-today').addEventListener('click', () => { selected = TODAY; closeCal(); refreshCurrent(); });
$('#cal-close').addEventListener('click', closeCal);
$('#mask').addEventListener('click', () => {
  closeCal();
  const d = $('#day');
  if (d) d.classList.remove('on');
});
['#cal-home', '#hr-date', '#act-date'].forEach(s => {
  const el = $(s);
  if (el) el.addEventListener('click', openCalendar);
});

/* ============ PWA ============ */
(function () {
  const l = document.createElement('link');
  l.rel = 'manifest';
  l.href = '/manifest.webmanifest?token=' + encodeURIComponent(TOKEN || '');
  document.head.appendChild(l);
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }
})();

/* ============ 启动 ============ */
(async function init() {
  if (!TOKEN) {
    const hint = t.has_data ? '' :
    `<div class="card" style="margin-bottom:12px;cursor:default;padding:12px 14px">
       <div style="font-size:13.5px;color:#8E8E93">${md(t.day)} 这天还没有同步到数据</div>
     </div>`;

  $('#hero-home').innerHTML = hint + `<div class="card hero" data-day="${t.day}" data-day="${t.day}"><div class="empty">链接缺少口令，请用带 ?token= 的完整链接打开</div></div>`;
    return;
  }
  try {
    const start = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 60));
    const data = await fetchWarm(`/api/days?start=${start}&end=${TODAY}&token=${encodeURIComponent(TOKEN)}`);
    (data.days || []).forEach(d => { dayMap[d.day] = d; });
    // 深链：?d=2026-11-20 直接定位到某一天
    const dq = new URLSearchParams(location.search).get('d');
    if (dq && /^\d{4}-\d{2}-\d{2}$/.test(dq)) selected = dq;
    // 默认选中「昨天」；如果昨天没数据但更早有，也别偷偷换天（交给页面显示"这天没有数据"）
    if (!dayMap[selected]) selected = latestDay() || selected;
    renderHome();
    const h = location.hash.replace('#', '');
    if (h === 'hr' || h === 'act') nav(h);
    // 深链：?dot=N 自动点开第 N 个数据点（排查用）
    const dotN = new URLSearchParams(location.search).get('dot');
    if (dotN) (function () {
      document.querySelectorAll('.chart-tip').forEach(t => { t.style.transition = 'none'; });
      const d = document.querySelectorAll('.chart-dot')[Number(dotN)];
      if (d) {
        d.classList.add('on');
        const c = d.querySelector('.pt');
        const tip = d.closest('.chart-wrap')?.querySelector('.chart-tip');
        const wrap = d.closest('.chart-wrap');
        if (tip && wrap) {
          const r = c.getBoundingClientRect(), b = wrap.getBoundingClientRect();
          tip.innerHTML = c.dataset.tip || 'no tip';
          tip.style.left = (r.left - b.left + r.width / 2) + 'px';
          tip.style.top = (r.top - b.top) + 'px';
          tip.classList.add('on');
        }
      }
    })();
    // 深链：?sheet=1 直接打开当天明细（排查用）
    if (new URLSearchParams(location.search).get('sheet') === '1') {
      const el = document.querySelector('#day');
      if (el) el.style.transition = 'none';
      document.querySelector('#mask').style.transition = 'none';
      openDaySheet(selected);
    }
    // 深链：?cal=1 直接打开日期选择器（排查/分享用）
    if (new URLSearchParams(location.search).get('cal') === '1') {
      document.querySelector('#cal').style.transition = 'none';
      document.querySelector('#mask').style.transition = 'none';
      openCalendar();
    }
  } catch (e) {
    const hint = t.has_data ? '' :
    `<div class="card" style="margin-bottom:12px;cursor:default;padding:12px 14px">
       <div style="font-size:13.5px;color:#8E8E93">${md(t.day)} 这天还没有同步到数据</div>
     </div>`;

    const auth = e.message === 'AUTH';
    $('#hero-home').innerHTML = hint + `<div class="card hero" data-day="${t.day}" data-day="${t.day}"><div class="empty">${
      auth ? '口令不对，请用带 ?token= 的完整链接打开' : '正在唤醒服务，稍后自动重试…'}</div></div>`;
    if (auth) return;                    // 口令错了刷新多少次都没用
    const n = Number(sessionStorage.getItem('wakeN') || 0);
    if (n < 5) {                         // 最多重试 5 次，间隔逐步拉长
      sessionStorage.setItem('wakeN', String(n + 1));
      setTimeout(() => location.reload(), 5000 + n * 3000);
    }
  }
})();
</script>
</body>
</html>
